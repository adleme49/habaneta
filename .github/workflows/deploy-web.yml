name: Deploy web

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, production]

# Branch routing:
#   develop → staging    Cloudflare Pages project: habaneta-staging
#   main    → production                            habaneta-production
#
# GitHub Environments scope per-env secrets:
#   CLOUDFLARE_API_TOKEN     scoped to Pages:Edit (can be the same token in both envs)
#   CLOUDFLARE_ACCOUNT_ID
#   PAGES_PROJECT_NAME       e.g. "habaneta-staging" or "habaneta-production"
#   VITE_HABANETA_API        e.g. "https://habaneta-backend-staging.fly.dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: >-
      ${{ github.event_name == 'workflow_dispatch'
          && inputs.environment
          || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_HABANETA_API: ${{ secrets.VITE_HABANETA_API }}
        run: pnpm --filter @habaneta/web build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ secrets.PAGES_PROJECT_NAME }}
