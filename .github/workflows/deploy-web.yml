name: Deploy web

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

# Cloudflare Pages deploy via Wrangler. Set these repository secrets
# before this workflow goes live:
#   CLOUDFLARE_API_TOKEN     — scoped to Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID
#   PAGES_PROJECT_NAME       — e.g. "habaneta"
#   VITE_HABANETA_API        — public URL of the deployed backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_HABANETA_API: ${{ secrets.VITE_HABANETA_API }}
        run: pnpm --filter @habaneta/web build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ secrets.PAGES_PROJECT_NAME }}
