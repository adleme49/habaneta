name: Test

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web (includes tsc)
        run: pnpm --filter @habaneta/web build

      - name: Typecheck mobile
        run: pnpm --filter @habaneta/mobile exec tsc --noEmit
